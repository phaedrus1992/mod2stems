[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/phaedrus1992/mod2stems"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
await_holding_lock = "deny"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[package]
name = "mod2stems"
version = "0.2.0"
description = "Exports per-channel stems from tracker modules"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The argument parser. It owns the spellings that the design leaves to
# implementation, and it prints the help and the usage errors.
clap = { version = "=4.6.7", features = ["derive"] }
flacenc = "=0.5.1"
hound = "=3.5.1"
openmpt-ext = { path = "crates/openmpt-ext", version = "0.0.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The SHA-256 digest of the input bytes. The manifest names the input by
# content, so a later reader proves which module produced the export.
sha2 = "=0.11.1"
# The cancellation flag. The workspace denies `unsafe_code`, so the command
# cannot install a signal handler itself.
signal-hook = "=0.4.6"

[dev-dependencies]
# The same pin that `crates/openmpt-ext` uses, so one lock entry serves both.
proptest = "=1.12.0"

[lints]
workspace = true
