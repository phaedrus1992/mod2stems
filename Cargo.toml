[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/phaedrus1992/mod2stems"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
await_holding_lock = "deny"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[package]
name = "mod2stems"
version = "0.0.0"
description = "Exports per-channel stems from tracker modules"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
openmpt-ext = { path = "crates/openmpt-ext", version = "0.0.0" }

[lints]
workspace = true
